<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fdfbf7"/>
  
  <!-- Decorative subtle circles -->
  <circle cx="950" cy="120" r="180" fill="#f5f0e6" opacity="0.5"/>
  <circle cx="150" cy="520" r="120" fill="#f3ebda" opacity="0.4"/>
  
  <!-- Logo (from Header component) -->
  <g transform="translate(150, 180)">
    <!-- Rounded square with copper gradient -->
    <defs>
      <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#d9927a"/>
        <stop offset="100%" style="stop-color:#b5624a"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#copperGrad)"/>
    <!-- Gem icon inside -->
    <svg x="25" y="25" width="50" height="50" viewBox="0 0 24 24" fill="#fdfbf7">
      <path d="M12 2L2 7l2 13h16l2-13L12 2zm0 3l6.5 4L17 17H7l-1.5-8L12 5z"/>
    </svg>
  </g>
  
  <!-- Main Title -->
  <text x="150" y="380" font-family="Georgia, serif" font-size="80" font-weight="500" fill="#5c4a33">
    Loris Lazulis
  </text>
  
  <!-- Tagline -->
  <text x="150" y="440" font-family="system-ui, sans-serif" font-size="26" font-weight="300" fill="#7a6241">
    Accompagnement indépendant pour l'achat
  </text>
  <text x="150" y="475" font-family="system-ui, sans-serif" font-size="26" font-weight="300" fill="#7a6241">
    de pierres naturelles certifiées
  </text>
  
  <!-- Subtle copper line -->
  <line x1="150" y1="520" x2="380" y2="520" stroke="#c97b5d" stroke-width="3" stroke-linecap="round"/>
  
  <!-- URL -->
  <text x="150" y="575" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#b09968">
    loris-lazulis.com
  </text>
</svg>
